
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Room | LuxeStay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f3ef;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #172b3a;
        }

        .navbar-brand {
            color: #d6b36a;
            font-size: 26px;
            font-weight: bold;
        }

        .booking-card {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .btn-book {
            background: #b18a43;
            color: white;
        }

        .btn-book:hover {
            background: #172b3a;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">LuxeStay</a>
        <a href="/rooms/" class="btn btn-outline-light">Back to Rooms</a>
    </div>
</nav>

<div class="container">
    <div class="booking-card">
        <h2 class="mb-3">Book Your Stay</h2>

        <h5>{{ room.name }}</h5>
        <p>Room Type: {{ room.room_type }}</p>
        <p>Price: ₹{{ room.price }} / night</p>

        <form method="post">
            {% csrf_token %}
            {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
{% endif %}

            <div class="mb-3">
                <label class="form-label">Guest Name</label>
                <input type="text" name="guest_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="guest_email" class="form-control" required>
            </div>
            <div class="mb-3">
    <label for="guest_phone" class="form-label">
        Phone Number
    </label>
    <input
        type="tel"
        name="guest_phone"
        id="guest_phone"
        class="form-control"
        placeholder="Enter your phone number"
    >
</div>


            <div class="mb-3">
                <label class="form-label">Check-in Date</label>
                <input type="date" name="check_in" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Check-out Date</label>
                <input type="date" name="check_out" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Number of Guests</label>
                <input type="number" name="guests" class="form-control"
                       min="1" max="{{ room.capacity }}" value="1" required>
            </div>

            <button type="submit" class="btn btn-book w-100">
                Confirm Booking
            </button>
        </form>
    </div>
</div>

</body>
</html>
