
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | LuxeStay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(5, 25, 20, 0.85),
                                rgba(5, 25, 20, 0.90)),
                url('https://images.unsplash.com/photo-1566073771259-6a8506099945');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .brand {
            color: #b38b45;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #66736d;
            margin-bottom: 28px;
        }

        .form-control {
            padding: 12px;
            margin-bottom: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #123c30;
            color: white;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #b38b45;
            color: #10251e;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">LuxeStay</div>
        <p class="subtitle">Staff Portal · Secure Login</p>

        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   required>

            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>

            <button type="submit" class="login-btn">
                Login to Dashboard
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            <a href="/" class="text-decoration-none">
                ← Back to Guest Website
            </a>
        </p>
    </div>
</body>
</html>
